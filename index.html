<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Collage Maker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Photo Collage Maker</h1>
            <p>Create beautiful collages with uniform photo sizes</p>
        </header>

        <div class="controls">
            <div class="upload-section">
                <label for="fileInput" class="upload-btn">
                    <span>📁 Select Photos</span>
                    <input type="file" id="fileInput" multiple accept="image/*">
                </label>
                <span id="photoCount">0 photos selected</span>
            </div>

            <div class="settings">
                <label>
                    Columns:
                    <input type="number" id="columns" min="2" max="12" value="6">
                </label>
                <label>
                    Photo Size:
                    <input type="range" id="photoSize" min="80" max="300" value="150">
                    <span id="sizeValue">150px</span>
                </label>
                <label>
                    Gap:
                    <input type="range" id="gap" min="0" max="20" value="5">
                    <span id="gapValue">5px</span>
                </label>
            </div>

            <div class="action-buttons">
                <button id="clearBtn">Clear All</button>
                <button id="downloadBtn">Download Collage</button>
                <button id="printBtn">Print A4</button>
            </div>
        </div>

        <div id="collage" class="collage"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
